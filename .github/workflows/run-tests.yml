name: Multi-Repo Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          path: code

      - name: Checkout Automation Repository
        env:
          AUTOMATION_TOKEN: ${{ secrets.AUTOMATION_REPO_TOKEN }}
        run: |
          if [ -z "$AUTOMATION_TOKEN" ]; then
            echo "Error: AUTOMATION_REPO_TOKEN secret is not set in this repository (epavan162/aitooldock)."
            echo "Please ensure you have added it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          git clone https://x-access-token:$AUTOMATION_TOKEN@github.com/ShobhaRani133/playwright-typescript-aitoolhub.git automation

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies (Automation)
        working-directory: ./automation
        run: npm install

      - name: Install Playwright Browsers
        working-directory: ./automation
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        working-directory: ./automation
        run: npx playwright test
        env:
          BASE_URL: https://aitooldock.netlify.app # You can change this if needed

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: automation/playwright-report/
          retention-days: 30
